name: Continuous Integration
on: push
jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v2
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.1
      - name: Run linting
        run: go vet ./...
      - name: Run tests
        run: go test ./calculators ./helpers
